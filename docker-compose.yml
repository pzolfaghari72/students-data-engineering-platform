# Project name with a default value.
name: ${PROJECT_NAME:-students-data-engineering-platform}

# Shared configuration for all Airflow services.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/plugins/Dockerfile
  image: students-platform-airflow:3.1.5-local
  # Linux owner ID for files mounted into Airflow containers.
  user: "${AIRFLOW_UID:-1000}:0"
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

  # Airflow runtime configuration and environment variables.
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    PYTHONPATH: /opt/airflow/dags
    # Fresh DAGs wait for an explicit trigger/unpause. Existing DAG states persist.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Container-to-container URL; this is not the host-published Airflow UI address.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW_API_SERVER_URL:-}

    # Airflow encryption and authentication secrets.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-}

    # Airflow metadata database connection.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD (URL-encode special characters)}@${POSTGRES_HOST:?Set POSTGRES_HOST}:${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}/${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME}

    # Initial Airflow administrator credentials.
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-}

    # Source SQL Server connection
    SOURCE_DB_HOST: ${SOURCE_DB_HOST:-}
    SOURCE_DB_PORT: ${SOURCE_DB_PORT:-}
    SOURCE_DB_NAME: ${SOURCE_DB_NAME:-}
    SOURCE_DB_USER: ${SOURCE_DB_USER:-}
    SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD:-}
    SOURCE_DB_ODBC_DRIVER: ${SOURCE_DB_ODBC_DRIVER:-}
    SOURCE_DB_SCHEMA: ${SOURCE_DB_SCHEMA:-}
    SOURCE_DB_ENCRYPT: ${SOURCE_DB_ENCRYPT:-}
    SOURCE_DB_TRUST_SERVER_CERTIFICATE: ${SOURCE_DB_TRUST_SERVER_CERTIFICATE:-}
    SOURCE_DB_CONNECTION_TIMEOUT: ${SOURCE_DB_CONNECTION_TIMEOUT:-}
    SOURCE_DB_SNAPSHOT_ISOLATION: ${SOURCE_DB_SNAPSHOT_ISOLATION:-}

    # PostgreSQL staging connection used by the SQL Server extraction DAG.
    STAGING_DB_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
    STAGING_DB_PORT: ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}
    STAGING_DB_NAME: ${STAGING_DB_NAME:?Set STAGING_DB_NAME}
    STAGING_DB_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
    STAGING_DB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}

    # JDBC settings for the Spark warehouse task executed by LocalExecutor.
    STAGING_JDBC_URL: jdbc:postgresql://${POSTGRES_HOST:?Set POSTGRES_HOST}:${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}/${STAGING_DB_NAME:?Set STAGING_DB_NAME}
    STAGING_JDBC_DRIVER: ${STAGING_JDBC_DRIVER:-}
    WAREHOUSE_JDBC_URL: jdbc:clickhouse:http://${CLICKHOUSE_HOST:?Set CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT:?Set CLICKHOUSE_HTTP_PORT}/${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME}
    WAREHOUSE_DB_USER: ${CLICKHOUSE_ADMIN_USER:?Set CLICKHOUSE_ADMIN_USER}
    WAREHOUSE_DB_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Set CLICKHOUSE_ADMIN_PASSWORD}
    WAREHOUSE_JDBC_DRIVER: ${WAREHOUSE_JDBC_DRIVER:-}
    WAREHOUSE_HOST: ${CLICKHOUSE_HOST:?Set CLICKHOUSE_HOST}
    WAREHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:?Set CLICKHOUSE_HTTP_PORT}
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME}
    STUDENT_ID_HMAC_KEY: ${STUDENT_ID_HMAC_KEY:-}
    BATCH_SNAPSHOT_SCHEDULE: ${BATCH_SNAPSHOT_SCHEDULE:-}
    SPARK_BATCH_MASTER: ${SPARK_BATCH_MASTER:-local[2]}
    SPARK_BATCH_DRIVER_MEMORY: ${SPARK_BATCH_DRIVER_MEMORY:-768m}
    SPARK_BATCH_SHUFFLE_PARTITIONS: ${SPARK_BATCH_SHUFFLE_PARTITIONS:-2}
    SPARK_BATCH_READ_PARTITIONS: ${SPARK_BATCH_READ_PARTITIONS:-2}
    SPARK_BATCH_FETCH_SIZE: ${SPARK_BATCH_FETCH_SIZE:-10000}
    SPARK_BATCH_WRITE_SIZE: ${SPARK_BATCH_WRITE_SIZE:-10000}

    # Container timezone.
    TZ: ${TIMEZONE:-UTC}

  # Shared directories for DAGs, logs, and custom plugins.
  volumes: &airflow-volumes
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./spark:/opt/spark-apps:ro

  # Attach Airflow services to the internal platform network.
  networks: [platform]


services:
  # PostgreSQL: Staging database and Airflow metadata database host.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_BOOTSTRAP_DB:?Set POSTGRES_BOOTSTRAP_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_CONTAINER_PORT: ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}
      TZ: ${TIMEZONE:-UTC}
    command: ["postgres", "-c", "port=${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}"]

    # Expose PostgreSQL only on the local machine.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}"

    # Persist PostgreSQL data.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Check PostgreSQL connection readiness.
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -p "$$POSTGRES_CONTAINER_PORT" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks: [platform]


  # Initialize the application databases using the PostgreSQL admin.
  postgres-init:
    image: postgres:16-alpine
    restart: "no"

    # Wait until PostgreSQL is healthy before initialization.
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
      POSTGRES_CONTAINER_PORT: ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_BOOTSTRAP_DB: ${POSTGRES_BOOTSTRAP_DB:?Set POSTGRES_BOOTSTRAP_DB}
      STAGING_DB_NAME: ${STAGING_DB_NAME:?Set STAGING_DB_NAME}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:?Set AIRFLOW_DB_NAME}

    # Execute the initialization script using the shell.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        # Connect to the PostgreSQL bootstrap database.
        psql -v ON_ERROR_STOP=1 -h "$$POSTGRES_HOST" -p "$$POSTGRES_CONTAINER_PORT" -U "$$POSTGRES_ADMIN_USER" -d "$$POSTGRES_BOOTSTRAP_DB" \
          -v staging_db="$$STAGING_DB_NAME" -v airflow_db="$$AIRFLOW_DB_NAME" <<'SQL'
        SELECT format('CREATE DATABASE %I', :'staging_db')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'staging_db') \gexec
        SELECT format('CREATE DATABASE %I', :'airflow_db')
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'airflow_db') \gexec
        SQL

    networks: [platform]



  # Apply staging DDL after the database is ready, including on an existing volume.
  staging-schema-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres-init:
        condition: service_completed_successfully

    environment:
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      STAGING_DB_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
      STAGING_DB_PORT: ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT}
      STAGING_DB_NAME: ${STAGING_DB_NAME:?Set STAGING_DB_NAME}
      STAGING_DB_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}

    volumes:
      - ./db/staging_postgres/staging_ddl:/staging_ddl:ro

    entrypoint: [/bin/sh, -ec]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -h "$$STAGING_DB_HOST" -p "$$STAGING_DB_PORT" -U "$$STAGING_DB_USER" -d "$$STAGING_DB_NAME" \
          -f /staging_ddl/metadata_schema.sql
        psql -v ON_ERROR_STOP=1 -h "$$STAGING_DB_HOST" -p "$$STAGING_DB_PORT" -U "$$STAGING_DB_USER" -d "$$STAGING_DB_NAME" \
          -f /staging_ddl/raw_tables.sql

    networks: [platform]


  # ClickHouse: Analytical data warehouse.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment: &clickhouse-env
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:?Set CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Set CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:?Set CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Set CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DB: ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME}
      CDC_DB_NAME: ${CDC_DB_NAME:-students_cdc}
      CLICKHOUSE_DASHBOARD_GROUP_BY_BYTES: ${CLICKHOUSE_DASHBOARD_GROUP_BY_BYTES:-134217728}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:?Set CLICKHOUSE_HTTP_PORT}
      CLICKHOUSE_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:?Set CLICKHOUSE_NATIVE_PORT}
      TZ: ${TIMEZONE:-UTC}

    # Expose HTTP and native client interfaces locally.
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_HTTP_PORT:-18123}:${CLICKHOUSE_HTTP_PORT:?Set CLICKHOUSE_HTTP_PORT}"
      - "127.0.0.1:${CLICKHOUSE_HOST_NATIVE_PORT:-19000}:${CLICKHOUSE_NATIVE_PORT:?Set CLICKHOUSE_NATIVE_PORT}"

    # Persist warehouse data and mount custom server configuration.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/profiles.xml:/etc/clickhouse-server/users.d/platform-profiles.xml:ro

    # Verify that ClickHouse can execute queries.
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --port "$$CLICKHOUSE_NATIVE_PORT" --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    networks: [platform]


  # Apply the warehouse DDL using the admin initialized by the server image.
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment: *clickhouse-env
    # Share networking for the localhost-based initializer.
    network_mode: "service:clickhouse"
    volumes:
      - ./scripts/initialize_clickhouse.sh:/opt/clickhouse-setup/initialize_clickhouse.sh:ro
      - ./db/warehouse_clickhouse:/warehouse_ddl:ro
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        bash -e /opt/clickhouse-setup/initialize_clickhouse.sh
        printf 'ClickHouse schemas initialized.\n'

  kafka:
    profiles: ["cdc"]
    image: apache/kafka:3.9.1
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1024m
    cpus: 1.0
    environment:
      # Unique Kafka cluster identifier.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}

      # Single-node KRaft configuration.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller

      # Persist broker records and KRaft metadata in the named volume.
      # For an existing broker, preserve/migrate its old logs before recreation.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Internal, controller, and external network listeners.
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_INTERNAL_PORT:-9092},CONTROLLER://:${KAFKA_CONTROLLER_PORT:-9093},EXTERNAL://:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-9092},EXTERNAL://${KAFKA_EXTERNAL_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-19094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      # KRaft controller quorum configuration.
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${KAFKA_HOST:-kafka}:${KAFKA_CONTROLLER_PORT:-9093}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Replication settings for a single-node development cluster.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      # Reduce consumer group startup delay.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      # Default partition count for newly created topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CONNECT_STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_STORAGE_TOPIC:-connect_statuses}
      CONNECT_OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_STORAGE_TOPIC:-connect_offsets}
      CONNECT_CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_STORAGE_TOPIC:-connect_configs}
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT:-9092}
      DEBEZIUM_TOPIC_PREFIX: ${DEBEZIUM_TOPIC_PREFIX:-students}
      DEBEZIUM_SCHEMA_HISTORY_TOPIC: ${DEBEZIUM_SCHEMA_HISTORY_TOPIC:-schema-history.students}
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-}
      SOURCE_DB_SCHEMA: ${SOURCE_DB_SCHEMA:-}
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-1}
      KAFKA_LOG_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}

    # Expose the external Kafka listener locally.
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19094}:${KAFKA_EXTERNAL_PORT:-9094}"

    # Persist Kafka topics, logs, and metadata.
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./scripts/prepare_cdc_topics.sh:/opt/platform/prepare_cdc_topics.sh:ro

    # Check Kafka broker availability.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:$$KAFKA_INTERNAL_PORT --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

    networks: [platform]


  # Debezium Kafka Connect: Run connectors for CDC and data integration.
  connect:
    profiles: ["cdc"]
    image: students-platform-connect:2.7.3
    build:
      context: ./debezium
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Start Kafka Connect only after Kafka becomes healthy.
    depends_on:
      kafka:
        condition: service_healthy

    environment:
      BOOTSTRAP_SERVERS: "${KAFKA_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-9092}"
      GROUP_ID: ${CONNECT_GROUP_ID:-1}
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CDC_SOURCE_PASSWORD: ${SOURCE_DB_PASSWORD:-}

      # Kafka topics used to store connector configurations, offsets, and status.
      CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_STORAGE_TOPIC:-connect_configs}
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_STORAGE_TOPIC:-connect_offsets}
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_STORAGE_TOPIC:-connect_statuses}
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      # Kafka Connect REST API configuration.
      # Debezium 2.7 entrypoint expects ADVERTISED_HOST_NAME / ADVERTISED_PORT.
      ADVERTISED_HOST_NAME: ${CONNECT_HOST:-connect}
      ADVERTISED_PORT: ${CONNECT_INTERNAL_PORT:-8083}
      REST_PORT: ${CONNECT_INTERNAL_PORT:-8083}
      KAFKA_HEAP_OPTS: ${CONNECT_HEAP_OPTS:--Xms512m -Xmx768m}
      # Expose Debezium runtime metrics for diagnostics.
      KAFKA_OPTS: "-javaagent:/opt/kafka/libs/jmx_prometheus_javaagent.jar=${CONNECT_METRICS_PORT:-9404}:/opt/kafka/config/jmx_exporter.yml"

    # Expose the Kafka Connect REST API locally.
    ports:
      - "127.0.0.1:${CONNECT_HOST_PORT:-18083}:${CONNECT_INTERNAL_PORT:-8083}"

    # REST readiness lets registration verify the connector task separately.
    # curl is supplied by the Debezium base image; retain it in the custom image.
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl --noproxy "*" -fsS --max-time 5 "http://127.0.0.1:$$REST_PORT/connectors" >/dev/null'
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s

    networks: [platform]

  # Create/check the SQL Server connector; reuse the existing registration script.
  # Success means connector readiness, not that its initial snapshot has finished.
  debezium-register:
    profiles: ["cdc"]
    image: python:3.12-alpine
    restart: "no"
    depends_on:
      connect:
        condition: service_healthy
    environment:
      CONNECT_REST_URL: "http://${CONNECT_HOST:-connect}:${CONNECT_INTERNAL_PORT:-8083}"
      CONNECTOR_HEALTH_TIMEOUT_SECONDS: ${CONNECTOR_HEALTH_TIMEOUT_SECONDS:-120}
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:-students-sqlserver}
      DEBEZIUM_TOPIC_PREFIX: ${DEBEZIUM_TOPIC_PREFIX:-students}
      DEBEZIUM_SCHEMA_HISTORY_TOPIC: ${DEBEZIUM_SCHEMA_HISTORY_TOPIC:-schema-history.students}
      DEBEZIUM_SNAPSHOT_ISOLATION_MODE: ${DEBEZIUM_SNAPSHOT_ISOLATION_MODE:-snapshot}
      DEBEZIUM_SNAPSHOT_MODE: ${DEBEZIUM_SNAPSHOT_MODE:-initial}
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-9092}"
      SOURCE_DB_HOST: ${SOURCE_DB_HOST:-}
      SOURCE_DB_PORT: ${SOURCE_DB_PORT:-}
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-}
      SOURCE_DB_USER: ${SOURCE_DB_USER:-}
      SOURCE_DB_SCHEMA: ${SOURCE_DB_SCHEMA:-}
      SOURCE_DB_ENCRYPT: ${SOURCE_DB_ENCRYPT:-}
      SOURCE_DB_TRUST_SERVER_CERTIFICATE: ${SOURCE_DB_TRUST_SERVER_CERTIFICATE:-}
      PYTHONPATH: /opt
    volumes:
      - ./debezium:/opt/debezium:ro
      - ./airflow/dags/students_staging:/opt/students_staging:ro
    command: ["python", "/opt/debezium/register_connector.py"]
    networks: [platform]


  spark-cdc-stream:
    image: students-platform-spark:3.5.6
    build:
      context: ./spark
      dockerfile: Dockerfile
    profiles: ["streaming"]
    restart: "on-failure:3"
    stop_grace_period: 60s
    mem_limit: ${SPARK_STREAM_MEMORY_LIMIT:-1536m}
    cpus: ${SPARK_STREAM_CPUS:-1.5}
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      debezium-register:
        condition: service_completed_successfully
    environment:
      PYTHONPATH: /opt/app
      STREAMING_APP_NAME: ${STREAMING_APP_NAME:-StudentsCdcStreaming}
      STREAMING_GENERATION_ID: ${STREAMING_GENERATION_ID:-students-cdc-v1}
      STREAMING_TRIGGER_INTERVAL: ${STREAMING_TRIGGER_INTERVAL:-5 seconds}
      STREAMING_BOOTSTRAP_TIMEOUT_SECONDS: ${STREAMING_BOOTSTRAP_TIMEOUT_SECONDS:-3600}
      STREAMING_QUERY_NAME: ${STREAMING_QUERY_NAME:-students-cdc}
      # This path must be under /opt/spark/checkpoints, the persistent mount.
      STREAMING_CHECKPOINT_DIR: ${CDC_CHECKPOINT_DIR:-/opt/spark/checkpoints/students-cdc-warehouse}
      STREAMING_MAX_OFFSETS_PER_TRIGGER: ${STREAMING_MAX_OFFSETS_PER_TRIGGER:-10000}
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_HOST:-kafka}:${KAFKA_INTERNAL_PORT:-9092}"
      DEBEZIUM_TOPIC_PREFIX: ${DEBEZIUM_TOPIC_PREFIX:-students}
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:-students-sqlserver}
      # Read Debezium's saved source offsets during streaming bootstrap.
      CONNECT_REST_URL: "http://${CONNECT_HOST:-connect}:${CONNECT_INTERNAL_PORT:-8083}"
      SOURCE_DB_NAME: ${SOURCE_DB_NAME:-}
      SOURCE_DB_SCHEMA: ${SOURCE_DB_SCHEMA:-}
      WAREHOUSE_HOST: ${CLICKHOUSE_HOST:?Set CLICKHOUSE_HOST}
      WAREHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:?Set CLICKHOUSE_HTTP_PORT}
      CDC_DB_NAME: ${CDC_DB_NAME:-students_cdc}
      CDC_DB_USER: ${CLICKHOUSE_ADMIN_USER:?Set CLICKHOUSE_ADMIN_USER}
      CDC_DB_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Set CLICKHOUSE_ADMIN_PASSWORD}
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - ./spark:/opt/spark-apps:ro
      - ./airflow/dags/students_staging:/opt/app/students_staging:ro
      - spark-streaming-checkpoints:/opt/spark/checkpoints
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "${SPARK_STREAM_MASTER:-local[2]}"
      - "--driver-memory"
      - "${SPARK_STREAM_DRIVER_MEMORY:-768m}"
      - "--conf"
      - "spark.jars.ivy=/tmp/.ivy2"
      - "--conf"
      - "spark.ui.showConsoleProgress=false"
      - "--conf"
      - "spark.sql.shuffle.partitions=${SPARK_STREAM_SHUFFLE_PARTITIONS:-2}"
      - "--packages"
      - "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6"
      - "/opt/spark-apps/stream_cdc.py"
    networks: [platform]


  # Airflow initialization: Prepare metadata database and create the administrator.
  airflow-init:
    <<: *airflow-common
    restart: "no"

    # Wait until PostgreSQL roles and databases are initialized.
    depends_on:
      postgres-init:
        condition: service_completed_successfully

    command:
      - bash
      - -ec
      - |
        # Apply Airflow metadata database migrations.
        airflow db migrate

        # Create the administrator only if it does not already exist.
        if airflow users list --output json | grep -Fq "\"$${AIRFLOW_ADMIN_USER}\""; then
          echo 'Airflow administrator already exists'
        else
          airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Platform --lastname Admin --role Admin --email "$${AIRFLOW_ADMIN_EMAIL}"
        fi


  # Airflow API server: Provide the Airflow web interface and API.
  airflow-api-server:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-18080}:8080"
    # Check API + database only. Requiring scheduler health here would create
    # a startup cycle because the scheduler waits for this API.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=5));
          raise SystemExit(0 if data.get('metadatabase', {}).get('status') == 'healthy' else 1)
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s


  # Airflow scheduler: Schedule DAG runs and manage task execution.
  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      staging-schema-init:
        condition: service_completed_successfully
      clickhouse-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2.0
    command: scheduler


  # Airflow DAG processor: Parse DAG files and discover workflows.
  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor


  # Grafana: Business KPI dashboards backed by ClickHouse.
  grafana:
    image: students-platform-grafana:11.5.2
    build:
      context: ./grafana
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PLUGINS: /usr/share/grafana/plugins
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:?Set CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Set CLICKHOUSE_ADMIN_PASSWORD}
      GRAFANA_DB_HOST: ${CLICKHOUSE_HOST:?Set CLICKHOUSE_HOST}
      GRAFANA_DB_NATIVE_PORT: ${CLICKHOUSE_NATIVE_PORT:?Set CLICKHOUSE_NATIVE_PORT}
      CDC_DB_NAME: ${CDC_DB_NAME:-students_cdc}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:?Set WAREHOUSE_DB_NAME in .env}
      TZ: ${TIMEZONE:-UTC}

    # Expose Grafana only on the local machine.
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"

    # Persist Grafana state and provision the ClickHouse data source/dashboard.
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks: [platform]
# Internal Docker bridge network for service-to-service communication.
networks:
  platform:
    driver: bridge


# Named volumes for persistent service data.
volumes:
  postgres-data:
  clickhouse-data:
  kafka-data:
  grafana-data:
  spark-streaming-checkpoints:
