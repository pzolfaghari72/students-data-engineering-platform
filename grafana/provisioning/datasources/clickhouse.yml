apiVersion: 1

datasources:
  - name: Students Warehouse
    uid: students-warehouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      host: $GRAFANA_DB_HOST
      port: $GRAFANA_DB_NATIVE_PORT
      protocol: native
      secure: false
      username: $CLICKHOUSE_ADMIN_USER
      defaultDatabase: $WAREHOUSE_DB_NAME
      dialTimeout: "10"
      queryTimeout: 60
      maxOpenConns: "4"
      maxIdleConns: "2"
    secureJsonData:
      password: $CLICKHOUSE_ADMIN_PASSWORD

  - name: Students CDC
    uid: students-cdc
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      host: $GRAFANA_DB_HOST
      port: $GRAFANA_DB_NATIVE_PORT
      protocol: native
      secure: false
      username: $CLICKHOUSE_ADMIN_USER
      defaultDatabase: $CDC_DB_NAME
      dialTimeout: "10"
      queryTimeout: 60
      maxOpenConns: "4"
      maxIdleConns: "2"
    secureJsonData:
      password: $CLICKHOUSE_ADMIN_PASSWORD
